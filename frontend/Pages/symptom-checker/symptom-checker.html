<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="symptom-checker.css">
    <title>Symptom Checker - MedMind</title>
</head>
<body>
    <div class="checker-page">
        <div class="checker-container">
            <h1 class="checker-title">Symptom checker</h1>
            <p class="checker-intro">Tick the symptoms you have. We show the diseases that match the most of them.</p>

            <div class="checker-symptoms" id="symptom-list"></div>
            <button type="button" class="checker-btn" id="check-button">Check my symptoms</button>

            <div class="checker-results" id="results"></div>
        </div>
    </div>
    <script type="module" src="symptom-checker.js"></script>
</body>
</html>
